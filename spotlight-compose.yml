services:
  spotlight:
    build: .
    image: dbpedia-spotlight
    env_file:
      - ".env"
    container_name: dbpedia-spotlight
    ports:
      - "2222:80"
    environment:
      - S3_PATH=${S3_PATH}
    volumes:
      # Mount only model data so image's /opt/spotlight (JAR + script) stays visible
      - spotlight-data:/opt/spotlight/data
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  spotlight-data:
