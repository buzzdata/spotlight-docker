version: '3.8'
services:

  spotlight:
    build: .
    container_name: dbpedia-spotlight
    ports:
      - "2222:80"
    environment:
      - S3_PATH=s3://dev-headless-ci/en_model.tar.gz
    volumes:
      - spotlight-data:/opt/spotlight
    restart: unless-stopped

  spotlight.en:
    image: dbpedia/dbpedia-spotlight
    container_name: dbpedia-spotlight.en
    volumes:
       - spotlight-model:/opt/spotlight/models
    restart: unless-stopped   
    ports:
       - "0.0.0.0:2222:80"  
    command: /bin/spotlight_s3.sh
    
  spotlight.de:
    image: dbpedia/dbpedia-spotlight
    container_name: dbpedia-spotlight.de
    volumes:
       - spotlight-model:/opt/spotlight/models
    restart: unless-stopped   
    ports:
       - "0.0.0.0:2223:80"  
    command: /bin/spotlight.sh de
    
  spotlight.pt:
    image: dbpedia/dbpedia-spotlight
    container_name: dbpedia-spotlight.pt
    volumes:
       - spotlight-model:/opt/spotlight/models
    restart: unless-stopped   
    ports:
       - "0.0.0.0:2224:80"  
    command: /bin/spotlight.sh pt
  
volumes:
  spotlight-data:
